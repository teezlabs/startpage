<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>//startpage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #00ff9c; --blue: #00eaff; --pink: #ff00ff; --reddit: #ff4500;
      --bg: #030307; --card: #080810; --border: #151520;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--bg);
      background-image: radial-gradient(ellipse 120% 90% at 50% 0%, #0b0b16 0%, var(--bg) 55%, #000 100%);
    }
    @media (min-width: 768px) { body { zoom: 1.35; } }

    /* Dot grid overlay */
    body::after {
      content: ''; position: fixed; inset: 0;
      background:
        linear-gradient(90deg, rgb(from var(--green) r g b / 0.03) 1px, transparent 1px),
        linear-gradient(rgb(from var(--green) r g b / 0.03) 1px, transparent 1px);
      background-size: 30px 30px; pointer-events: none; z-index: 0;
    }

    /* Ambient glow blobs */
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 15%, rgb(from var(--pink) r g b / 0.10), transparent 60%),
        radial-gradient(ellipse 80% 60% at 85% 15%, rgb(from var(--blue) r g b / 0.08), transparent 55%),
        radial-gradient(ellipse 80% 60% at 50% 85%, rgb(from var(--green) r g b / 0.06), transparent 50%);
      filter: blur(40px); pointer-events: none; z-index: 0;
      animation: drift 24s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(-1.5%, -1%, 0) scale(1.03); }
      to   { transform: translate3d(1.5%, 1.5%, 0) scale(1.08); }
    }

    .logo {
      background-color: var(--green);
      -webkit-mask-image: url('TL.png'); mask-image: url('TL.png');
      -webkit-mask-mode: luminance; mask-mode: luminance;
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      transition: background-color 0.4s ease;
    }

    .neon-green { color: var(--green); text-shadow: 0 0 10px var(--green), 0 0 20px var(--green); }
    .headline {
      background-image: linear-gradient(100deg, var(--green), var(--blue) 45%, var(--pink) 70%, var(--green));
      background-size: 260% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 12px rgb(from var(--green) r g b / 0.45));
      animation: shimmer 9s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 0% 50%; }
      to   { background-position: 260% 50%; }
    }

    /* Clock chip */
    .clock {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 3px 11px; border-radius: 999px;
      border: 1px solid rgb(from var(--blue) r g b / 0.25);
      background: rgb(from var(--blue) r g b / 0.05);
    }
    .clock::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: var(--blue); box-shadow: 0 0 8px var(--blue);
    }
    .neon-pink  { color: var(--pink);  text-shadow: 0 0 10px var(--pink),  0 0 20px var(--pink);  }
    .neon-blue  { color: var(--blue);  }

    /* Cards */
    .card {
      background: linear-gradient(180deg, rgba(8,8,16,0.95), rgba(6,6,12,0.95));
      border: 1px solid var(--border);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      overflow: hidden; position: relative;
    }
    .card::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(300px 150px at 20% 0%, rgb(from var(--blue) r g b / 0.07), transparent 60%),
        radial-gradient(300px 150px at 80% 0%, rgb(from var(--pink) r g b / 0.05), transparent 60%);
      pointer-events: none;
    }
    .card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      opacity: 0.25; transition: opacity 0.25s ease; pointer-events: none;
    }
    .card:hover {
      border-color: rgb(from var(--green) r g b / 0.55);
      box-shadow:
        0 0 0 1px rgb(from var(--green) r g b / 0.12),
        0 14px 40px -12px rgb(from var(--green) r g b / 0.35),
        0 0 30px rgb(from var(--green) r g b / 0.18),
        inset 0 0 40px rgb(from var(--green) r g b / 0.05);
      transform: translateY(-4px);
    }
    .card:hover::after { opacity: 1; }

    /* Entrance stagger, first paint only */
    .cards-enter .card { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    .cards-enter .card:nth-child(1) { animation-delay: 0.02s; }
    .cards-enter .card:nth-child(2) { animation-delay: 0.07s; }
    .cards-enter .card:nth-child(3) { animation-delay: 0.12s; }
    .cards-enter .card:nth-child(4) { animation-delay: 0.17s; }
    .cards-enter .card:nth-child(5) { animation-delay: 0.22s; }
    .cards-enter .card:nth-child(6) { animation-delay: 0.27s; }
    .cards-enter .card:nth-child(n+7) { animation-delay: 0.32s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Search */
    .search-form {
      background: linear-gradient(180deg, rgba(8,8,16,0.95), rgba(6,6,12,0.95));
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-form:focus-within {
      border-color: rgb(from var(--green) r g b / 0.65);
      box-shadow:
        0 0 0 1px rgb(from var(--green) r g b / 0.18),
        0 0 34px rgb(from var(--green) r g b / 0.22),
        inset 0 0 26px rgb(from var(--green) r g b / 0.05);
      transform: translateY(-1px);
    }
    .search-form input { caret-color: var(--green); }

    /* Animations */
    .greeting { animation: glitch 5s infinite; }
    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      96%       { transform: translate(0); }
      97%       { transform: translate(-2px, 2px); }
      98%       { transform: translate(2px, -2px); }
      99%       { transform: translate(-2px, -2px); }
    }

    .date-pulse { animation: datepulse 3s ease-in-out infinite; }
    @keyframes datepulse {
      0%, 100% { text-shadow: 0 0 5px var(--blue); }
      50%       { text-shadow: 0 0 15px var(--blue), 0 0 25px var(--blue); }
    }

    /* Feed toggle button */
    .feed-toggle {
      font-size: 0.65em; color: rgb(from var(--blue) r g b / 0.5); background: none;
      border: 1px solid rgb(from var(--blue) r g b / 0.2); border-radius: 4px;
      padding: 3px 10px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.1em; transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .feed-toggle:hover {
      color: var(--blue); border-color: rgb(from var(--blue) r g b / 0.7);
      box-shadow: 0 0 14px rgb(from var(--blue) r g b / 0.3), inset 0 0 12px rgb(from var(--blue) r g b / 0.08);
    }

    /* Ticker container (collapsed by default) */
    .ticker-container {
      width: 100%; overflow: hidden;
      max-height: 0;
      transition: max-height 0.1s ease 0.4s;
    }
    .ticker-container.open {
      max-height: 50px;
      transition: max-height 0.1s ease 0s;
    }

    /* News ticker */
    .ticker-wrap {
      width: 100%; display: flex; align-items: center; gap: 0;
      background: linear-gradient(90deg, rgba(255,69,0,0.08), rgba(255,69,0,0.03));
      border: 1px solid rgba(255,69,0,0.2);
      border-radius: 6px; overflow: hidden; position: relative;
      box-shadow: 0 0 12px rgba(255,69,0,0.08), inset 0 0 20px rgba(255,69,0,0.03);
      transform: translateX(110%);
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0s;
    }
    .ticker-container.open .ticker-wrap {
      transform: translateX(0);
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0.08s;
    }
    .ticker-wrap::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px, rgba(255,69,0,0.015) 2px, rgba(255,69,0,0.015) 4px
      );
    }
    .ticker-label {
      font-size: 0.7em; color: var(--reddit); padding: 6px 10px;
      border-right: 1px solid rgba(255,69,0,0.2); white-space: nowrap; flex-shrink: 0;
      text-shadow: 0 0 8px var(--reddit); letter-spacing: 0.1em;
      background: rgba(255,69,0,0.06);
    }
    .ticker-track { overflow: hidden; flex: 1; }
    .ticker-inner {
      display: inline-block; white-space: nowrap; padding: 6px 0;
      animation: ticker-scroll 60s linear infinite;
    }
    .ticker-inner:hover { animation-play-state: paused; }
    @keyframes ticker-scroll {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }
    a.ticker-link {
      color: rgba(255,69,0,0.75); font-size: 0.72em; text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s; letter-spacing: 0.02em;
    }
    a.ticker-link:hover { color: var(--reddit); text-shadow: 0 0 8px var(--reddit); }
    .ticker-sep { color: rgba(255,69,0,0.3); padding: 0 16px; font-size: 0.72em; }

    /* Edit mode */
    .edit-input {
      background: rgb(from var(--green) r g b / 0.05); border: 1px solid rgb(from var(--green) r g b / 0.2);
      border-radius: 3px; color: #c0c0d0; font-family: 'JetBrains Mono', monospace;
      font-size: 0.72em; padding: 2px 5px; outline: none; min-width: 0;
    }
    .edit-input:focus { border-color: rgb(from var(--green) r g b / 0.5); }
    .edit-x {
      color: rgba(255,80,80,0.5); background: none; border: none; cursor: pointer;
      font-size: 0.9em; padding: 0 2px; flex-shrink: 0; line-height: 1;
      transition: color 0.15s;
    }
    .edit-x:hover { color: #ff5050; }
    .edit-pencil {
      color: rgb(from var(--green) r g b / 0.3); background: none; border: none; cursor: pointer;
      font-size: 0.72em; padding: 0 2px; flex-shrink: 0;
      transition: color 0.15s;
    }
    .edit-pencil:hover { color: var(--green); }
    .edit-confirm {
      color: rgb(from var(--green) r g b / 0.5); background: none; border: none; cursor: pointer;
      font-size: 0.82em; padding: 0 3px; flex-shrink: 0;
      transition: color 0.15s;
    }
    .edit-confirm:hover { color: var(--green); }
    .edit-add-link {
      color: rgb(from var(--green) r g b / 0.35); background: none;
      border: 1px dashed rgb(from var(--green) r g b / 0.2); border-radius: 3px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.68em;
      padding: 2px 6px; cursor: pointer; width: 100%;
      transition: color 0.15s, border-color 0.15s;
    }
    .go-btn {
      color: var(--green);
      border-left: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      background: none;
      transition: background-color 0.2s, color 0.2s;
    }
    .go-btn:hover {
      background: rgb(from var(--green) r g b / 0.14);
      color: #fff;
      text-shadow: 0 0 10px rgb(from var(--green) r g b / 0.8);
    }
    .edit-add-link:hover { color: var(--green); border-color: rgb(from var(--green) r g b / 0.5); }
    #edit-toggle {
      font-size: 0.65em; color: rgb(from var(--green) r g b / 0.4); background: none;
      border: 1px solid rgb(from var(--green) r g b / 0.2); border-radius: 4px;
      padding: 3px 10px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.1em; transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    #edit-toggle:hover, #edit-toggle.active {
      color: var(--green); border-color: rgb(from var(--green) r g b / 0.7);
      box-shadow: 0 0 14px rgb(from var(--green) r g b / 0.3), inset 0 0 12px rgb(from var(--green) r g b / 0.08);
    }
    .cards-edit a.link { pointer-events: none; cursor: default; }

    /* Card reordering */
    .drag-handle {
      color: rgb(from var(--green) r g b / 0.35); cursor: grab;
      font-size: 0.8em; line-height: 1; padding: 0 1px; flex-shrink: 0;
      user-select: none; transition: color 0.15s;
    }
    .drag-handle:hover { color: var(--green); }
    .drag-handle:active { cursor: grabbing; }
    .card.dragging { opacity: 0.35; }
    .card.drop-before, .card.drop-after { position: relative; }
    .card.drop-before::after, .card.drop-after::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 2px; height: auto;
      background: var(--green); box-shadow: 0 0 10px var(--green);
      opacity: 1; pointer-events: none; z-index: 20;
      animation: pulse-edge 0.9s ease-in-out infinite;
    }
    @keyframes pulse-edge { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .card.drop-before::after { left: 0; }
    .card.drop-after::after  { right: 0; }

    /* Links */
    a.link {
      color: #707085; font-size: 0.88em; text-decoration: none; position: relative;
      transition: color 0.18s ease, text-shadow 0.18s ease, transform 0.18s ease;
      white-space: nowrap; display: inline-block;
    }
    a.link::before {
      content: '\203a'; position: absolute; left: -9px; top: 0;
      color: var(--green); opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      transform: translateX(-3px);
    }
    a.link:hover {
      color: var(--green); text-shadow: 0 0 10px rgb(from var(--green) r g b / 0.7);
      transform: translateX(5px);
    }
    a.link:hover::before { opacity: 1; transform: translateX(0); }

    /* ── Mobile ──────────────────────────────────────────────────────────── */
    @media (max-width: 767px) {
      /* Cards: 2-column grid, fill width */
      #cards-container {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      #cards-container .card {
        min-width: 0 !important;
        width: 100% !important;
      }

      /* Bigger tap targets for links */
      a.link {
        font-size: 0.95em;
        display: inline-block;
        padding: 3px 0;
      }

      /* Bigger toolbar buttons */
      .feed-toggle, #edit-toggle {
        padding: 8px 14px;
        font-size: 0.72em;
        min-height: 40px;
      }

      /* Drop indicator spans the row edge in grid layout */
      .card.drop-before::after, .card.drop-after::after {
        width: auto; height: 2px; left: 0; right: 0; top: auto; bottom: auto;
        background: var(--green);
      }
      .card.drop-before::after { top: 0; }
      .card.drop-after::after  { bottom: 0; }

      /* Ticker readable on small screens */
      .ticker-label { font-size: 0.65em; padding: 6px 7px; }
      a.ticker-link { font-size: 0.68em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <link id="wallpaper-colors" rel="stylesheet" href="colors.css">
</head>

<body class="min-h-screen flex items-start justify-center pt-8 sm:pt-16 px-3 pb-4 text-[#a0a0b0]">
  <div class="relative z-10 flex flex-col items-center w-full max-w-5xl gap-2">

    <!-- Logo -->
    <div class="logo h-20 w-20 sm:h-40 sm:w-40" role="img" aria-label="TeezLabs"></div>

    <!-- Greeting -->
    <h1 class="headline text-2xl sm:text-3xl font-bold tracking-wider">「 Hello Teez 」</h1>

    <!-- Date/time -->
    <div id="date" class="clock text-xs neon-blue tracking-wide font-mono mt-1"></div>

    <!-- Search bar -->
    <form class="search-form flex items-center w-full max-w-md mt-4" action="https://duckduckgo.com/" method="get">
      <label for="search" class="sr-only">Search</label>
      <input
        id="search" type="text" name="q" placeholder="Search..." autofocus required
        class="flex-1 bg-transparent border-none outline-none text-[#c0c0d0] font-mono text-sm px-4 py-2 placeholder-[#404050]"
      >
      <button
        type="submit"
        class="go-btn"
      >Go</button>
    </form>

    <!-- Link categories (rendered by JS) -->
    <div id="cards-container" class="flex flex-wrap gap-3 justify-center w-full mt-4"></div>

    <!-- Toolbar -->
    <div class="w-full flex justify-end gap-2">
<button id="edit-toggle" onclick="toggleEdit()">✎ EDIT</button>
      <button id="feed-toggle" class="feed-toggle" onclick="toggleFeed()">▶ FEED</button>
    </div>

    <!-- Reddit Ticker -->
    <div id="ticker-container" class="ticker-container">
      <div class="ticker-wrap">
        <div class="ticker-label">REDDIT //</div>
        <div class="ticker-track">
          <div id="ticker-inner" class="ticker-inner">fetching headlines...</div>
        </div>
      </div>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
